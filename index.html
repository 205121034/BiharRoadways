<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>बिहार राज्य पथ परिवहन निगम · रूट 19</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Mukta:wght@400;500;600&family=Teko:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --sky-top:#0B1830;
    --sky-mid:#1F3A5F;
    --sky-horizon:#7A5A6B;
    --road:#2B2B2E;
    --road-line:#F4EFE3;
    --livery-yellow:#F4B400;
    --livery-green:#1B7A43;
    --tail-red:#D6483C;
    --headlight:#FFE9A8;
    --cream:#F4EFE3;
    --panel:#101B22;
    --panel-edge:#223038;
    font-family:'Mukta',sans-serif;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%; overflow:hidden; background:var(--sky-top); color:var(--cream);}
  body{position:relative; width:100vw; height:100vh; user-select:none;}

  /* ---------- SKY & SCENE ---------- */
  .scene{position:absolute; inset:0; overflow:hidden;}
  .sky{position:absolute; inset:0;
    background:linear-gradient(180deg, var(--sky-top) 0%, var(--sky-mid) 55%, var(--sky-horizon) 78%, #3a2430 90%);
  }
  .stars{position:absolute; inset:0 0 40% 0; background-image:radial-gradient(1.5px 1.5px at 20% 20%, #fff8 50%, transparent 51%),
    radial-gradient(1.5px 1.5px at 60% 10%, #fff6 50%, transparent 51%),
    radial-gradient(1px 1px at 80% 30%, #fff5 50%, transparent 51%),
    radial-gradient(1px 1px at 35% 40%, #fff4 50%, transparent 51%),
    radial-gradient(1.5px 1.5px at 90% 15%, #fff7 50%, transparent 51%),
    radial-gradient(1px 1px at 10% 55%, #fff4 50%, transparent 51%);
    opacity:.8;
  }
  .moon{position:absolute; top:8%; right:12%; width:56px; height:56px; border-radius:50%;
    background:radial-gradient(circle at 35% 35%, #fff9dd, #f4d98a 60%, #e8bf5a 100%);
    box-shadow:0 0 40px 10px rgba(255,233,168,.25);
  }
  .hills-back{position:absolute; bottom:22%; left:0; width:220%; height:22%;
    background:#20303f; opacity:.55;
    clip-path:polygon(0% 100%, 4% 60%, 12% 80%, 20% 45%, 30% 75%, 40% 50%, 52% 85%, 62% 55%, 74% 78%, 84% 48%, 94% 82%, 100% 60%, 100% 100%);
    animation:driftSlow 46s linear infinite;
  }
  .hills-front{position:absolute; bottom:20%; left:0; width:220%; height:16%;
    background:#162530; opacity:.75;
    clip-path:polygon(0% 100%, 6% 55%, 16% 90%, 26% 40%, 36% 85%, 48% 50%, 58% 88%, 70% 42%, 82% 80%, 92% 50%, 100% 100%);
    animation:driftSlow 28s linear infinite;
  }
  @keyframes driftSlow{ from{transform:translateX(0);} to{transform:translateX(-50%);} }

  .roadside-strip{position:absolute; bottom:0; left:0; width:100%; height:26%;
    background:linear-gradient(180deg, #16311f 0%, #0f2417 100%);
  }

  /* trees / km-stones scrolling past */
  .track-layer{position:absolute; bottom:8%; left:0; width:260%; height:18%; display:flex; align-items:flex-end;
    animation:scrollFast 6s linear infinite;
  }
  .track-layer.paused{animation-play-state:paused;}
  @keyframes scrollFast{ from{transform:translateX(0);} to{transform:translateX(-38.46%);} }
  .tree{width:14px; height:46px; margin-right:120px; flex:0 0 auto; position:relative;}
  .tree::before{content:"";position:absolute; bottom:0; left:5px; width:4px; height:18px; background:#3b2a1c;}
  .tree::after{content:"";position:absolute; bottom:14px; left:-8px; width:30px; height:34px; border-radius:50% 50% 45% 45%;
    background:#1e4b2c;}
  .kmstone{width:8px; height:26px; margin-right:220px; flex:0 0 auto; background:#e7e2d4; border-top:6px solid var(--tail-red); border-radius:2px;}

  /* ---------- ROAD ---------- */
  .road{position:absolute; bottom:0; left:0; width:100%; height:22%; background:var(--road);
    box-shadow: inset 0 12px 24px -12px #000;
  }
  .road::before{content:""; position:absolute; top:0; left:0; right:0; height:5px; background:#3a3a3d;}
  .lane-lines{position:absolute; top:50%; left:0; width:260%; height:8px; transform:translateY(-50%);
    background-image:repeating-linear-gradient(90deg, var(--road-line) 0 60px, transparent 60px 120px);
    animation:scrollFast 1.1s linear infinite;
  }
  .lane-lines.paused{animation-play-state:paused;}

  /* ---------- DESTINATION BOARD ---------- */
  .board-wrap{position:absolute; top:22px; left:50%; transform:translateX(-50%); text-align:center; z-index:5;}
  .brand{font-family:'Baloo 2',sans-serif; font-weight:800; font-size:clamp(20px,3vw,32px);
    letter-spacing:.5px; color:var(--livery-yellow); text-shadow:0 2px 0 #6b4a06, 0 0 24px rgba(244,180,0,.25);}
  .board{margin-top:8px; display:inline-block; background:#0c0f08; border:3px solid #3a3a1f; border-radius:6px;
    padding:6px 22px; box-shadow:0 6px 18px rgba(0,0,0,.5);}
  .board .route{font-family:'Teko',sans-serif; font-size:clamp(20px,2.4vw,28px); letter-spacing:2px; color:#ffd23f;
    font-weight:600; white-space:nowrap; overflow:hidden;}
  .route-flip{display:inline-block; animation:flipRoutes 12s steps(1) infinite;}
  @keyframes flipRoutes{
    0%,22%{content:"";}
  }

  /* ---------- BUS ---------- */
  .bus-wrap{position:absolute; bottom:8.5%; left:50%; width:min(560px,62vw); transform:translateX(-50%);
    animation:busBob 0.5s ease-in-out infinite alternate; z-index:4;}
  .bus-wrap.idle{animation-play-state:paused;}
  @keyframes busBob{ from{transform:translateX(-50%) translateY(0);} to{transform:translateX(-50%) translateY(-3px);} }
  .bus-svg{width:100%; display:block; filter:drop-shadow(0 14px 10px rgba(0,0,0,.45));}
  .wheel{animation:spin .5s linear infinite;}
  .wheel.idle{animation-play-state:paused;}
  @keyframes spin{ from{transform:rotate(0deg);} to{transform:rotate(360deg);} }
  .headlamp-beam{opacity:0; transition:opacity .3s;}
  .headlamp-beam.on{opacity:1;}
  .taillight{animation:blinkTail 1.6s ease-in-out infinite;}
  @keyframes blinkTail{ 0%,100%{opacity:1;} 50%{opacity:.45;} }

  /* ---------- STEERING WHEEL (drag to look) ---------- */
  .wheel-dock{position:absolute; right:22px; bottom:132px; width:92px; height:92px; z-index:6; cursor:grab;}
  .wheel-dock:active{cursor:grabbing;}
  .wheel-dock svg{width:100%; height:100%; filter:drop-shadow(0 4px 8px rgba(0,0,0,.5));}
  .wheel-hint{position:absolute; right:22px; bottom:104px; font-size:11px; color:#cfe3d8aa; text-align:center; width:92px;}

  /* ---------- DASHBOARD / TAPE DECK ---------- */
  .dash{position:absolute; left:0; right:0; bottom:0; z-index:10;
    background:linear-gradient(180deg, var(--panel-edge) 0%, var(--panel) 18%, #0b1418 100%);
    border-top:3px solid #33474f; padding:12px 18px 14px;
    display:flex; align-items:center; gap:18px; flex-wrap:wrap; justify-content:center;
  }
  .gauge{display:flex; flex-direction:column; align-items:center; min-width:90px;}
  .gauge .num{font-family:'Teko',sans-serif; font-size:34px; font-weight:600; color:var(--livery-yellow); line-height:1;}
  .gauge .lbl{font-size:11px; letter-spacing:1px; color:#9db3ad; margin-top:2px;}

  .btn{background:#16262c; border:1px solid #2c4048; color:var(--cream); border-radius:10px;
    padding:10px 14px; font-size:13px; cursor:pointer; transition:transform .1s, background .2s;
    font-family:'Mukta',sans-serif; font-weight:500;}
  .btn:hover{background:#1f353d;}
  .btn:active{transform:scale(.94);}
  .btn.primary{background:var(--livery-green); border-color:#134f2e; color:#eafff0; font-weight:600;}
  .btn.primary:hover{background:#218a4d;}
  .btn.horn{background:var(--tail-red); border-color:#7d2018; color:#fff; font-weight:700;}
  .btn.horn:hover{background:#e2564a;}

  .tape{display:flex; align-items:center; gap:12px; background:#0c1518; border:1px solid #26383e; border-radius:14px; padding:10px 16px;}
  .reel{width:34px; height:34px; border-radius:50%; background:radial-gradient(circle at center, #3a2a12 0 8px, #17100a 9px 30%, #2a1c0d 31% 100%);
    position:relative; animation:spin 1.8s linear infinite;}
  .reel.idle{animation-play-state:paused;}
  .reel::before{content:""; position:absolute; inset:0; border-radius:50%;
    background-image:repeating-conic-gradient(#5a3d16 0 6deg, transparent 6deg 30deg);
    opacity:.5;}
  .track-info{display:flex; flex-direction:column; min-width:150px;}
  .track-info .name{font-size:13px; font-weight:600; color:var(--livery-yellow);}
  .track-info .time{font-family:'Teko',sans-serif; font-size:15px; color:#9db3ad; letter-spacing:1px;}
  .tape-controls{display:flex; gap:6px;}
  .tape-controls .btn{padding:8px 11px; font-size:16px;}

  /* ---------- PLAYLIST PANEL ---------- */
  .playlist-panel{position:fixed; right:18px; bottom:96px; width:260px; max-height:340px; overflow-y:auto;
    background:#0c1518; border:1px solid #26383e; border-radius:14px; padding:10px; z-index:20;
    transform:translateY(12px) scale(.98); opacity:0; pointer-events:none; transition:all .18s ease;
    box-shadow:0 12px 30px rgba(0,0,0,.5);}
  .playlist-panel.open{transform:translateY(0) scale(1); opacity:1; pointer-events:auto;}
  .playlist-panel h4{font-size:12px; letter-spacing:1px; color:#9db3ad; margin-bottom:8px; font-weight:600;}
  .playlist-item{display:flex; align-items:center; gap:8px; padding:8px 8px; border-radius:8px; cursor:pointer; font-size:13px;}
  .playlist-item:hover{background:#16262c;}
  .playlist-item.active{background:#1B7A43; color:#eafff0;}
  .playlist-item .idx{font-family:'Teko',sans-serif; font-size:15px; color:#9db3ad; width:18px;}
  .playlist-item.active .idx{color:#eafff0;}
  @media (max-width:640px){
    .playlist-panel{right:8px; left:8px; width:auto; bottom:150px;}
  }

  .toast{position:fixed; top:20px; left:50%; transform:translate(-50%,-140%); background:#0c1518;
    border:1px solid #2c4048; color:var(--cream); padding:10px 18px; border-radius:10px; font-size:13px;
    transition:transform .35s ease; z-index:50; pointer-events:none;}
  .toast.show{transform:translate(-50%,0);}

  @media (max-width:640px){
    .wheel-dock, .wheel-hint{display:none;}
    .dash{gap:10px; padding:10px 10px 12px;}
    .gauge{min-width:64px;}
    .track-info{min-width:110px;}
  }
</style>
</head>
<body>

<div class="scene">
  <div class="sky"></div>
  <div class="stars"></div>
  <div class="moon"></div>
  <div class="hills-back"></div>
  <div class="hills-front"></div>
  <div class="roadside-strip"></div>
  <div class="track-layer" id="trackLayer">
    <div class="tree"></div><div class="tree"></div><div class="kmstone"></div>
    <div class="tree"></div><div class="tree"></div><div class="tree"></div><div class="kmstone"></div>
    <div class="tree"></div><div class="tree"></div><div class="tree"></div><div class="kmstone"></div>
    <div class="tree"></div><div class="tree"></div><div class="tree"></div><div class="kmstone"></div>
  </div>
  <div class="road">
    <div class="lane-lines" id="laneLines"></div>
  </div>
</div>

<div class="board-wrap">
  <div class="brand">बिहार राज्य पथ परिवहन निगम</div>
  <div class="board"><div class="route" id="routeText">पटना → सीवान, वाया हाजीपुर → सोनपुर → छपरा</div></div>
</div>

<div class="bus-wrap idle" id="busWrap">
  <svg class="bus-svg" viewBox="0 0 560 220" xmlns="http://www.w3.org/2000/svg">
    <!-- headlight beams -->
    <polygon class="headlamp-beam" id="beamL" points="30,150 -60,120 -60,190" fill="#FFE9A8" opacity="0"/>
    <!-- body -->
    <rect x="20" y="55" width="500" height="95" rx="18" fill="#F4B400" stroke="#8a5c00" stroke-width="3"/>
    <rect x="20" y="55" width="500" height="30" rx="14" fill="#1B7A43" stroke="#0e4a27" stroke-width="2"/>
    <rect x="10" y="120" width="520" height="20" fill="#8a5c00" opacity=".25"/>
    <!-- destination box -->
    <rect x="40" y="62" width="150" height="16" rx="3" fill="#0c0f08"/>
    <text x="115" y="74" font-family="Teko, sans-serif" font-size="12" fill="#ffd23f" text-anchor="middle">पटना - सीवान</text>
    <!-- windows -->
    <g fill="#bfe3ef" stroke="#1a2b30" stroke-width="2">
      <rect x="45" y="92" width="52" height="34" rx="4"/>
      <rect x="105" y="92" width="52" height="34" rx="4"/>
      <rect x="165" y="92" width="52" height="34" rx="4"/>
      <rect x="225" y="92" width="52" height="34" rx="4"/>
      <rect x="285" y="92" width="52" height="34" rx="4"/>
      <rect x="345" y="92" width="52" height="34" rx="4"/>
      <rect x="405" y="92" width="52" height="34" rx="4"/>
    </g>
    <!-- driver windshield -->
    <rect x="466" y="88" width="44" height="40" rx="6" fill="#cdeff5" stroke="#1a2b30" stroke-width="2"/>
    <!-- door -->
    <rect x="466" y="132" width="34" height="18" rx="2" fill="#8a5c00" opacity=".4"/>
    <!-- bumper / lights -->
    <rect x="500" y="118" width="14" height="34" rx="4" fill="#6f3f00"/>
    <circle class="taillight" cx="24" cy="128" r="6" fill="#D6483C"/>
    <circle id="headlightBulb" cx="512" cy="126" r="6" fill="#FFE9A8"/>
    <polygon class="headlamp-beam" id="beamR" points="518,126 610,102 610,152" fill="#FFE9A8"/>
    <!-- painted slogan -->
    <text x="270" y="145" font-family="Baloo 2, sans-serif" font-size="13" font-weight="700" fill="#7a4b00" text-anchor="middle">हॉर्न प्लीज़ 🙏</text>
    <!-- wheels -->
    <g class="wheel" id="wheelBack" transform-origin="95 168">
      <circle cx="95" cy="168" r="26" fill="#1c1c1c"/>
      <circle cx="95" cy="168" r="10" fill="#c9c9c9"/>
      <rect x="93" y="146" width="4" height="44" fill="#555"/>
      <rect x="73" y="166" width="44" height="4" fill="#555"/>
    </g>
    <g class="wheel" id="wheelFront" transform-origin="440 168">
      <circle cx="440" cy="168" r="26" fill="#1c1c1c"/>
      <circle cx="440" cy="168" r="10" fill="#c9c9c9"/>
      <rect x="438" y="146" width="4" height="44" fill="#555"/>
      <rect x="418" y="166" width="44" height="4" fill="#555"/>
    </g>
  </svg>
</div>

<div class="wheel-dock" id="steerDock" title="खींचकर घुमाओ">
  <svg viewBox="0 0 100 100">
    <circle cx="50" cy="50" r="42" fill="none" stroke="#2b2b2e" stroke-width="10"/>
    <circle cx="50" cy="50" r="42" fill="none" stroke="#F4B400" stroke-width="3"/>
    <circle cx="50" cy="50" r="12" fill="#1B7A43" stroke="#0e4a27" stroke-width="2"/>
    <g id="steerSpokes" stroke="#F4B400" stroke-width="6">
      <line x1="50" y1="18" x2="50" y2="38"/>
      <line x1="22" y1="66" x2="40" y2="55"/>
      <line x1="78" y1="66" x2="60" y2="55"/>
    </g>
  </svg>
</div>
<div class="wheel-hint">खींचकर घुमाओ</div>

<div class="dash">
  <div class="gauge">
    <div class="num" id="speedNum">0</div>
    <div class="lbl">किमी / घंटा</div>
  </div>

  <button class="btn primary" id="driveBtn">▶ चलाओ</button>
  <button class="btn horn" id="hornBtn">📯 हॉर्न</button>
  <button class="btn" id="lightBtn">💡 हेडलाइट</button>

  <div class="tape">
    <div class="reel" id="reelL"></div>
    <div class="track-info">
      <div class="name" id="trackName">टेप 1 · भोर की सवारी</div>
      <div class="time" id="trackTime">0:00 / 2:40</div>
    </div>
    <div class="reel" id="reelR"></div>
    <div class="tape-controls">
      <button class="btn" id="prevBtn">⏮</button>
      <button class="btn primary" id="playBtn">▶</button>
      <button class="btn" id="nextBtn">⏭</button>
      <button class="btn" id="muteBtn">🔊</button>
   
    </div>
  </div>
</div>

<div class="playlist-panel" id="playlistPanel">
  <h4>प्लेलिस्ट</h4>
  <div id="playlistItems"></div>
</div>

<div id="ytPlayer" style="position:fixed; bottom:-100px; left:-100px; width:1px; height:1px; opacity:0; pointer-events:none;"></div>

<div class="toast" id="toast"></div>

<script>
(function(){
  const busWrap = document.getElementById('busWrap');
  const trackLayer = document.getElementById('trackLayer');
  const laneLines = document.getElementById('laneLines');
  const wheelBack = document.getElementById('wheelBack');
  const wheelFront = document.getElementById('wheelFront');
  const speedNum = document.getElementById('speedNum');
  const driveBtn = document.getElementById('driveBtn');
  const hornBtn = document.getElementById('hornBtn');
  const lightBtn = document.getElementById('lightBtn');
  const beamL = document.getElementById('beamL');
  const beamR = document.getElementById('beamR');
  const headlightBulb = document.getElementById('headlightBulb');
  const playBtn = document.getElementById('playBtn');
  const prevBtn = document.getElementById('prevBtn');
  const nextBtn = document.getElementById('nextBtn');
  const muteBtn = document.getElementById('muteBtn');
  const reelL = document.getElementById('reelL');
  const reelR = document.getElementById('reelR');
  const trackName = document.getElementById('trackName');
  const trackTime = document.getElementById('trackTime');
  const routeText = document.getElementById('routeText');
  const toast = document.getElementById('toast');
  const steerDock = document.getElementById('steerDock');
  const steerSpokes = document.getElementById('steerSpokes');

  const routes = [
    "पटना → गया, वाया बिहारशरीफ",
    "पटना → मुजफ्फरपुर, वाया हाजीपुर",
    "भागलपुर → पटना, वाया मोकामा",
    "पटना → दरभंगा, वाया समस्तीपुर",
    "छपरा → पटना, वाया सोनपुर"
  ];
  let routeIdx = 0;
  setInterval(() => {
    routeIdx = (routeIdx + 1) % routes.length;
    routeText.textContent = routes[routeIdx];
  }, 4200);

  // ---------- Audio (Web Audio API — synthesized, no external files) ----------
  let ctx = null;
  function getCtx(){ if(!ctx){ ctx = new (window.AudioContext||window.webkitAudioContext)(); } return ctx; }
  let muted = false;

  function honk(){
    const c = getCtx();
    if(muted) return;
    const t0 = c.currentTime;
    [220, 174].forEach((freq, i) => {
      const osc = c.createOscillator();
      const gain = c.createGain();
      osc.type = 'sawtooth';
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(0.0001, t0);
      gain.gain.exponentialRampToValueAtTime(0.18, t0 + 0.05 + i*0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.55 + i*0.02);
      osc.connect(gain).connect(c.destination);
      osc.start(t0);
      osc.stop(t0 + 0.6 + i*0.02);
    });
    showToast('पों पों! 📯');
  }

  // ---------- Real YouTube playlist (official IFrame Player API) ----------
  // Paste a YouTube playlist ID below. Find it in a playlist URL:
  //   youtube.com/playlist?list=THIS_PART
  // or on any video that's playing as part of a playlist:
  //   youtube.com/watch?v=...&list=THIS_PART
  // (YouTube Music has no public embed API — use the equivalent playlist
  // on regular YouTube, e.g. rebuild it there if it's a YT Music-only one.)
  const YOUTUBE_PLAYLIST_ID = "PLEQ-guCV3qundLrXfI-fDuTH-VuJbJGfe";

  const playlistPanel = document.getElementById('playlistPanel');
  const playlistItems = document.getElementById('playlistItems');
  const playlistBtn = document.getElementById('playlistBtn');

  let playing = false;
  let playlistVideoIds = [];   // filled once the player has loaded the playlist
  let curIndex = 0;

  // --- YouTube IFrame Player setup (loads lazily, hidden 1x1 player) ---
  let ytPlayer = null, ytReady = false, ytReadyQueue = [];
  const ytTag = document.createElement('script');
  ytTag.src = "https://www.youtube.com/iframe_api";
  document.head.appendChild(ytTag);
  window.onYouTubeIframeAPIReady = function(){
    ytPlayer = new YT.Player('ytPlayer', {
      height: '1', width: '1',
      playerVars: { playsinline: 1, listType: 'playlist', list: YOUTUBE_PLAYLIST_ID },
      events: {
        onReady: () => {
          ytReady = true;
          ytReadyQueue.forEach(fn => fn()); ytReadyQueue = [];
          playlistVideoIds = ytPlayer.getPlaylist() || [];
          buildPlaylistUI();
          updateTrackUI();
        },
        onStateChange: (e) => {
          curIndex = ytPlayer.getPlaylistIndex();
          updateTrackUI();
          if(e.data === YT.PlayerState.PLAYING){
            playing = true; playBtn.textContent = '⏸';
            reelL.classList.remove('idle'); reelR.classList.remove('idle');
          } else if(e.data === YT.PlayerState.PAUSED){
            playing = false; playBtn.textContent = '▶';
            reelL.classList.add('idle'); reelR.classList.add('idle');
          }
        }
      }
    });
  };
  function whenYtReady(fn){ ytReady ? fn() : ytReadyQueue.push(fn); }

  function fmtTime(s){
    if(!isFinite(s) || isNaN(s)) return "0:00";
    const m = Math.floor(s/60), r = Math.floor(s%60);
    return m + ":" + String(r).padStart(2,'0');
  }

  // fetch a video's title via YouTube's public oEmbed endpoint (no API key needed)
  const titleCache = {};
  function fetchTitle(videoId, cb){
    if(titleCache[videoId]){ cb(titleCache[videoId]); return; }
    fetch(`https://www.youtube.com/oembed?url=https://www.youtube.com/watch?v=${videoId}&format=json`)
      .then(r => r.ok ? r.json() : null)
      .then(data => {
        const title = data && data.title ? data.title : videoId;
        titleCache[videoId] = title;
        cb(title);
      })
      .catch(() => cb(videoId));
  }

  let ytPollTimer = null;
  function updateTrackUI(){
    if(!ytReady) return;
    const vid = playlistVideoIds[curIndex];
    if(vid){
      fetchTitle(vid, (title) => { trackName.textContent = title; });
    }
    trackTime.textContent = fmtTime(ytPlayer.getCurrentTime()) + " / " + fmtTime(ytPlayer.getDuration());
    [...playlistItems.children].forEach((el, i) => el.classList.toggle('active', i === curIndex));
  }
  function buildPlaylistUI(){
    playlistItems.innerHTML = '';
    playlistVideoIds.forEach((vid, i) => {
      const row = document.createElement('div');
      row.className = 'playlist-item' + (i === curIndex ? ' active' : '');
      row.innerHTML = `<span class="idx">${i+1}</span><span class="pl-name">…</span>`;
      row.addEventListener('click', () => { ytPlayer.playVideoAt(i); });
      playlistItems.appendChild(row);
      fetchTitle(vid, (title) => { row.querySelector('.pl-name').textContent = title; });
    });
  }
  function startTape(){
    whenYtReady(() => {
      ytPlayer.playVideo();
      clearInterval(ytPollTimer);
      ytPollTimer = setInterval(updateTrackUI, 500);
    });
  }
  function stopTape(){
    if(ytPlayer && ytReady) ytPlayer.pauseVideo();
    clearInterval(ytPollTimer);
  }
  function nextTrack(){ whenYtReady(() => ytPlayer.nextVideo()); }
  function prevTrack(){ whenYtReady(() => ytPlayer.previousVideo()); }

  playBtn.addEventListener('click', () => {
    playing ? stopTape() : startTape();
  });
  nextBtn.addEventListener('click', () => { nextTrack(); });
  prevBtn.addEventListener('click', () => { prevTrack(); });
  muteBtn.addEventListener('click', () => {
    muted = !muted;
    if(ytPlayer && ytReady){ muted ? ytPlayer.mute() : ytPlayer.unMute(); }
    muteBtn.textContent = muted ? '🔇' : '🔊';
  });
  

  // ---------- Drive state ----------
  let driving = false, speedTimer = null, curSpeed = 0;
  function setDriving(on){
    driving = on;
    driveBtn.textContent = on ? '⏸ रोको' : '▶ चलाओ';
    busWrap.classList.toggle('idle', !on);
    trackLayer.classList.toggle('idle', false);
    wheelBack.classList.toggle('idle', !on);
    wheelFront.classList.toggle('idle', !on);
    if(on){
      trackLayer.style.animationPlayState = 'running';
      laneLines.style.animationPlayState = 'running';
      speedTimer = setInterval(() => {
        curSpeed = Math.min(62, curSpeed + Math.round(Math.random()*6));
        speedNum.textContent = curSpeed;
      }, 400);
      if(!playing) startTape();
    } else {
      trackLayer.style.animationPlayState = 'paused';
      laneLines.style.animationPlayState = 'paused';
      clearInterval(speedTimer);
      curSpeed = 0;
      speedNum.textContent = 0;
    }
  }
  driveBtn.addEventListener('click', () => { getCtx().resume && getCtx().resume(); setDriving(!driving); });
  hornBtn.addEventListener('click', () => { getCtx().resume && getCtx().resume(); honk(); });

  let lightsOn = false;
  lightBtn.addEventListener('click', () => {
    lightsOn = !lightsOn;
    beamR.classList.toggle('on', lightsOn);
    headlightBulb.setAttribute('fill', lightsOn ? '#fff6c8' : '#FFE9A8');
    lightBtn.textContent = lightsOn ? '💡 हेडलाइट बंद' : '💡 हेडलाइट';
  });

  // ---------- Steering drag → parallax ----------
  let dragging = false, lastX = 0, rotation = 0, parallax = 0;
  function pointerX(e){ return e.touches ? e.touches[0].clientX : e.clientX; }
  steerDock.addEventListener('pointerdown', (e) => { dragging = true; lastX = pointerX(e); });
  window.addEventListener('pointermove', (e) => {
    if(!dragging) return;
    const x = pointerX(e);
    const dx = x - lastX;
    lastX = x;
    rotation += dx * 1.4;
    rotation = Math.max(-90, Math.min(90, rotation));
    steerSpokes.setAttribute('transform', `rotate(${rotation} 50 50)`);
    parallax = Math.max(-40, Math.min(40, parallax + dx*0.3));
    document.querySelector('.hills-back').style.transform = `translateX(${-parallax*0.6}px)`;
    document.querySelector('.hills-front').style.transform = `translateX(${-parallax}px)`;
  });
  window.addEventListener('pointerup', () => {
    dragging = false;
    rotation = 0;
    steerSpokes.setAttribute('transform', 'rotate(0 50 50)');
  });

  function showToast(msg){
    toast.textContent = msg;
    toast.classList.add('show');
    clearTimeout(showToast._t);
    showToast._t = setTimeout(() => toast.classList.remove('show'), 1600);
  }

  showToast('डिपो से बस निकल रही है… 🚌');
})();
</script>
</body>
</html>
